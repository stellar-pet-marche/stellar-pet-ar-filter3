<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#170b2f">
  <title>ステラペットマルシェ ARフィルター</title>

  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #08040f;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    }

    button {
      font: inherit;
    }

    #app {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(132, 72, 190, 0.35), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(255, 132, 29, 0.25), transparent 35%),
        #10071f;
    }

    /* 最初の案内画面 */
    #startScreen {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        calc(24px + var(--safe-top))
        24px
        calc(24px + var(--safe-bottom));
      color: #fff;
      text-align: center;
    }

    .start-card {
      width: min(92vw, 480px);
      padding: 28px 22px 24px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      background: rgba(20, 9, 40, 0.82);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(14px);
    }

    .star {
      font-size: 50px;
      line-height: 1;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(24px, 7vw, 34px);
      line-height: 1.35;
    }

    .lead {
      margin: 0;
      font-size: 16px;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.88);
    }

    .notice {
      margin: 18px 0 0;
      padding: 13px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 13px;
      line-height: 1.65;
      color: rgba(255, 255, 255, 0.78);
      text-align: left;
    }

    .primary-button {
      width: 100%;
      margin-top: 22px;
      padding: 16px 18px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff8a00, #ff4e74);
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 10px 28px rgba(255, 91, 72, 0.35);
      cursor: pointer;
    }

    .primary-button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    /* カメラ画面 */
    #cameraScreen {
      position: absolute;
      inset: 0;
      display: none;
      background: #000;
    }

    #camera,
    #captureCanvas,
    #frameImage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #camera {
      z-index: 1;
      object-fit: cover;
      background: #000;
    }

    #captureCanvas {
      z-index: 0;
      display: none;
    }

    #frameImage {
      z-index: 10;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    #countdown {
      position: absolute;
      z-index: 20;
      top: calc(18px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 520px);
      padding: 11px 16px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      background: rgba(41, 13, 67, 0.72);
      color: #fff;
      text-align: center;
      font-weight: 900;
      font-size: clamp(18px, 5vw, 27px);
      letter-spacing: 0.02em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    #controls {
      position: absolute;
      z-index: 30;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 18px 22px calc(20px + var(--safe-bottom));
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.72));
    }

    .round-button {
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(20, 20, 20, 0.6);
      backdrop-filter: blur(8px);
      cursor: pointer;
    }

    #captureButton {
      width: 76px;
      height: 76px;
      border: 6px solid rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 5px 22px rgba(0, 0, 0, 0.35);
    }

    #captureButton::after {
      content: "";
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #fff;
    }

    #switchButton {
      width: 52px;
      height: 52px;
      font-size: 24px;
    }

    .control-spacer {
      width: 52px;
      height: 52px;
    }

    /* 撮影後の確認画面 */
    #previewScreen {
      position: absolute;
      inset: 0;
      z-index: 80;
      display: none;
      background: #000;
    }

    #previewImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #previewActions {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 18px 18px calc(20px + var(--safe-bottom));
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.86));
    }

    .preview-button {
      min-height: 52px;
      border: 0;
      border-radius: 999px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
    }

    #retakeButton {
      color: #fff;
      background: rgba(255, 255, 255, 0.18);
    }

    #saveButton {
      color: #fff;
      background: linear-gradient(135deg, #ff8a00, #ff4e74);
    }

    /* エラー表示 */
    #errorBox {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(255, 78, 116, 0.16);
      color: #ffdce4;
      font-size: 14px;
      line-height: 1.65;
      text-align: left;
    }
  </style>
</head>

<body>
  <main id="app">
    <section id="startScreen">
      <div class="start-card">
        <div class="star">🌟</div>
        <h1>ステラペットマルシェ<br>ARフォトフレーム</h1>

        <p class="lead">
          カメラを許可すると、オリジナルフレームを重ねて撮影できます。
        </p>

        <div class="notice">
          「カメラを起動する」を押したあと、ブラウザに表示される
          <strong>カメラの使用許可</strong>で「許可」を選んでください。
          撮影した写真は端末内で処理され、外部サーバーには送信されません。
        </div>

        <button id="startButton" class="primary-button" type="button">
          カメラを起動する
        </button>

        <div id="errorBox"></div>
      </div>
    </section>

    <section id="cameraScreen">
      <video id="camera" autoplay muted playsinline></video>
      <canvas id="captureCanvas"></canvas>

      <!-- GitHub上に同じ名前でframe.pngを置いてください -->
      <img id="frameImage" src="./frame.png" alt="ステラペットマルシェ フレーム">

      <div id="countdown">ステラペットマルシェまであと－日！</div>

      <div id="controls">
        <button id="switchButton" class="round-button" type="button" aria-label="カメラを切り替える">
          ↻
        </button>

        <button id="captureButton" class="round-button" type="button" aria-label="撮影する"></button>

        <div class="control-spacer" aria-hidden="true"></div>
      </div>
    </section>

    <section id="previewScreen">
      <img id="previewImage" alt="撮影した写真">

      <div id="previewActions">
        <button id="retakeButton" class="preview-button" type="button">
          撮り直す
        </button>
        <button id="saveButton" class="preview-button" type="button">
          写真を保存
        </button>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const EVENT_DATE = "2026-10-17T00:00:00+09:00";

      const startScreen = document.getElementById("startScreen");
      const cameraScreen = document.getElementById("cameraScreen");
      const previewScreen = document.getElementById("previewScreen");

      const startButton = document.getElementById("startButton");
      const captureButton = document.getElementById("captureButton");
      const switchButton = document.getElementById("switchButton");
      const retakeButton = document.getElementById("retakeButton");
      const saveButton = document.getElementById("saveButton");

      const camera = document.getElementById("camera");
      const canvas = document.getElementById("captureCanvas");
      const frameImage = document.getElementById("frameImage");
      const previewImage = document.getElementById("previewImage");
      const countdown = document.getElementById("countdown");
      const errorBox = document.getElementById("errorBox");

      let stream = null;
      let facingMode = "environment";
      let capturedDataUrl = "";

      function getJapanDateParts(date = new Date()) {
        const formatter = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Tokyo",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        });

        const parts = formatter.formatToParts(date);
        const values = {};

        for (const part of parts) {
          if (part.type !== "literal") {
            values[part.type] = Number(part.value);
          }
        }

        return values;
      }

      function getJapanMidnightTimestamp(date = new Date()) {
        const { year, month, day } = getJapanDateParts(date);
        return Date.UTC(year, month - 1, day);
      }

      function updateCountdown() {
        const todayJst = getJapanMidnightTimestamp();
        const eventJst = Date.UTC(2026, 9, 17);
        const days = Math.ceil((eventJst - todayJst) / 86400000);

        if (days > 0) {
          countdown.textContent = `ステラペットマルシェまであと${days}日！`;
        } else if (days === 0) {
          countdown.textContent = "ステラペットマルシェ、本日開催！";
        } else if (days === -1) {
          countdown.textContent = "ステラペットマルシェ、2日目開催中！";
        } else {
          countdown.textContent = "ステラペットマルシェにご来場ありがとうございました！";
        }
      }

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
      }

      function clearError() {
        errorBox.textContent = "";
        errorBox.style.display = "none";
      }

      function stopCamera() {
        if (stream) {
          for (const track of stream.getTracks()) {
            track.stop();
          }
          stream = null;
        }
        camera.srcObject = null;
      }

      async function startCamera() {
        clearError();
        startButton.disabled = true;
        startButton.textContent = "カメラを準備しています…";

        if (!window.isSecureContext) {
          showError(
            "カメラはHTTPS接続でのみ使用できます。GitHub Pagesの公開URLから開いてください。"
          );
          startButton.disabled = false;
          startButton.textContent = "カメラを起動する";
          return;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showError(
            "このブラウザではカメラ機能を利用できません。ChromeまたはSafariの最新版で開いてください。"
          );
          startButton.disabled = false;
          startButton.textContent = "カメラを起動する";
          return;
        }

        try {
          stopCamera();

          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: facingMode },
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            }
          });

          camera.srcObject = stream;
          await camera.play();

          startScreen.style.display = "none";
          previewScreen.style.display = "none";
          cameraScreen.style.display = "block";
        } catch (error) {
          console.error(error);

          let message =
            "カメラを起動できませんでした。ブラウザの設定でカメラを許可してから、もう一度お試しください。";

          if (error && error.name === "NotAllowedError") {
            message =
              "カメラの使用が許可されていません。ブラウザのアドレス欄付近にある設定から、カメラを「許可」に変更してください。";
          } else if (error && error.name === "NotFoundError") {
            message = "利用できるカメラが見つかりませんでした。";
          } else if (error && error.name === "NotReadableError") {
            message =
              "ほかのアプリがカメラを使用している可能性があります。カメラアプリなどを閉じてから再度お試しください。";
          }

          showError(message);
        } finally {
          startButton.disabled = false;
          startButton.textContent = "カメラを起動する";
        }
      }

      function drawCoverImage(context, source, canvasWidth, canvasHeight) {
        const sourceWidth = source.videoWidth || source.naturalWidth;
        const sourceHeight = source.videoHeight || source.naturalHeight;

        const scale = Math.max(
          canvasWidth / sourceWidth,
          canvasHeight / sourceHeight
        );

        const drawWidth = sourceWidth * scale;
        const drawHeight = sourceHeight * scale;
        const x = (canvasWidth - drawWidth) / 2;
        const y = (canvasHeight - drawHeight) / 2;

        context.drawImage(source, x, y, drawWidth, drawHeight);
      }

      function drawCountdown(context, width, height) {
        const text = countdown.textContent;
        const fontSize = Math.max(34, Math.round(width * 0.055));
        const horizontalPadding = Math.round(fontSize * 0.75);
        const verticalPadding = Math.round(fontSize * 0.42);
        const y = Math.round(height * 0.045);

        context.save();
        context.font = `900 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic", Meiryo, sans-serif`;
        context.textAlign = "center";
        context.textBaseline = "middle";

        const measured = context.measureText(text);
        const boxWidth = Math.min(
          width * 0.92,
          measured.width + horizontalPadding * 2
        );
        const boxHeight = fontSize + verticalPadding * 2;
        const x = (width - boxWidth) / 2;
        const radius = boxHeight / 2;

        context.fillStyle = "rgba(41, 13, 67, 0.78)";
        context.strokeStyle = "rgba(255, 255, 255, 0.95)";
        context.lineWidth = Math.max(3, width * 0.004);

        context.beginPath();
        context.roundRect(x, y, boxWidth, boxHeight, radius);
        context.fill();
        context.stroke();

        context.shadowColor = "rgba(0, 0, 0, 0.75)";
        context.shadowBlur = Math.max(5, width * 0.01);
        context.fillStyle = "#ffffff";
        context.fillText(text, width / 2, y + boxHeight / 2);

        context.restore();
      }

      function capturePhoto() {
        if (!camera.videoWidth || !camera.videoHeight) {
          return;
        }

        const portrait = window.innerHeight >= window.innerWidth;
        const outputWidth = portrait ? 1080 : 1920;
        const outputHeight = portrait ? 1920 : 1080;

        canvas.width = outputWidth;
        canvas.height = outputHeight;

        const context = canvas.getContext("2d", { alpha: false });

        if (!context) {
          showError("写真の作成に失敗しました。");
          return;
        }

        context.clearRect(0, 0, outputWidth, outputHeight);
        drawCoverImage(context, camera, outputWidth, outputHeight);

        if (frameImage.complete && frameImage.naturalWidth > 0) {
          context.drawImage(frameImage, 0, 0, outputWidth, outputHeight);
        }

        drawCountdown(context, outputWidth, outputHeight);

        capturedDataUrl = canvas.toDataURL("image/jpeg", 0.94);
        previewImage.src = capturedDataUrl;

        cameraScreen.style.display = "none";
        previewScreen.style.display = "block";
      }

      async function switchCamera() {
        facingMode = facingMode === "environment" ? "user" : "environment";
        await startCamera();
      }

      function retakePhoto() {
        capturedDataUrl = "";
        previewImage.removeAttribute("src");
        previewScreen.style.display = "none";
        cameraScreen.style.display = "block";
      }

      async function savePhoto() {
        if (!capturedDataUrl) {
          return;
        }

        const response = await fetch(capturedDataUrl);
        const blob = await response.blob();
        const filename = `stellar-pet-marche-${Date.now()}.jpg`;
        const file = new File([blob], filename, { type: "image/jpeg" });

        if (
          navigator.canShare &&
          navigator.canShare({ files: [file] })
        ) {
          try {
            await navigator.share({
              files: [file],
              title: "ステラペットマルシェ",
              text: "ステラペットマルシェ オリジナルフレームで撮影しました！"
            });
            return;
          } catch (error) {
            if (error && error.name === "AbortError") {
              return;
            }
          }
        }

        const link = document.createElement("a");
        link.href = capturedDataUrl;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
      }

      startButton.addEventListener("click", startCamera);
      captureButton.addEventListener("click", capturePhoto);
      switchButton.addEventListener("click", switchCamera);
      retakeButton.addEventListener("click", retakePhoto);
      saveButton.addEventListener("click", savePhoto);

      frameImage.addEventListener("error", () => {
        alert(
          "frame.pngが見つかりません。index.htmlと同じ場所に、ファイル名を半角小文字で「frame.png」として置いてください。"
        );
      });

      window.addEventListener("beforeunload", stopCamera);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && previewScreen.style.display !== "block") {
          stopCamera();
        }
      });

      updateCountdown();
      setInterval(updateCountdown, 60 * 60 * 1000);
    })();
  </script>
</body>
</html>
