<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ec">
  <meta name="description" content="ステラペットマルシェ 第2回隠しミッション ARフィルター">
  <title>第2回 隠しミッション｜ステラペットマルシェ</title>
  <style>
    :root { color-scheme:light; --navy:#153a76; --gold:#efb529; --cream:#fff8ec; --ink:#26334a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; color:var(--ink); font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; background:radial-gradient(ellipse at 50% 0%,#fff 0,#fff8ec 58%,#fff0d3 100%); }
    button { font:inherit; }
    .screen { min-height:100svh; display:flex; align-items:center; justify-content:center; padding:24px 18px max(24px,env(safe-area-inset-bottom)); }
    .card { position:relative; overflow:hidden; width:min(100%,480px); padding:clamp(24px,7vw,40px); text-align:center; background:#ffffffed; border:1px solid #f0dfb5; border-radius:30px; box-shadow:0 18px 55px #6e57221a; }
    .card:before,.card:after { content:"✦"; position:absolute; color:var(--gold); font-size:24px; }
    .card:before { top:16px; left:20px; }.card:after { right:20px; bottom:14px; }
    .eyebrow { display:inline-block; padding:7px 15px; border-radius:99px; background:#fff0c8; color:#805500; font-size:.82rem; font-weight:850; letter-spacing:.08em; }
    h1 { margin:17px 0 10px; color:var(--navy); font-size:clamp(1.8rem,8vw,2.45rem); line-height:1.25; }
    .intro { margin:0 auto 20px; font-size:1.05rem; line-height:1.75; }
    .mission { margin:20px 0; padding:16px 14px; border:1px solid #d9e3f7; border-radius:20px; background:#f5f8ff; }
    .mission-title { margin:0; color:var(--navy); font-weight:900; font-size:1.08rem; line-height:1.65; }
    .tags { margin:11px 0 0; color:var(--navy); font-weight:750; font-size:.92rem; line-height:1.8; overflow-wrap:anywhere; }
    .note { margin:14px 0 0; color:#657086; font-size:.82rem; line-height:1.55; }
    .primary,.secondary { border:0; border-radius:999px; cursor:pointer; font-weight:850; }
    .primary { width:100%; min-height:58px; padding:14px 18px; color:#fff; background:linear-gradient(100deg,#193e80,#2754a1); box-shadow:0 8px 18px #153a7633; font-size:1.05rem; }
    .secondary { min-height:48px; padding:11px 17px; color:var(--navy); background:#edf2fc; }
    .primary:active,.secondary:active { transform:translateY(1px); }
    .error { margin:13px 0 0; color:#ad2f18; font-weight:750; line-height:1.55; }
    .hidden { display:none!important; }
    #cameraScreen,#captureScreen { min-height:100svh; padding:0; background:#111; color:#fff; }
    .camera { position:relative; width:100%; height:100svh; overflow:hidden; background:#111; }
    #video { width:100%; height:100%; object-fit:cover; }
    #frame { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; pointer-events:none; visibility:hidden; }
    .cam-top { position:absolute; top:max(14px,env(safe-area-inset-top)); left:14px; right:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .cam-label { padding:9px 13px; border-radius:99px; background:#0008; font-size:.82rem; font-weight:800; backdrop-filter:blur(8px); }
    .icon-button { width:42px; height:42px; border:0; border-radius:50%; color:#fff; background:#0009; font-size:1.35rem; cursor:pointer; }
    .cam-bottom { position:absolute; right:0; bottom:max(22px,env(safe-area-inset-bottom)); left:0; display:flex; align-items:center; justify-content:center; gap:20px; padding:0 18px; }
    .shutter { width:74px; height:74px; border:5px solid #fff; border-radius:50%; background:#ffffff55; box-shadow:0 0 0 3px #0005; cursor:pointer; }
    .flip { width:52px; height:52px; border:0; border-radius:50%; color:#fff; background:#0009; font-size:1.35rem; cursor:pointer; }
    .result-wrap { width:min(100%,480px); padding:24px 18px max(24px,env(safe-area-inset-bottom)); text-align:center; }
    #resultImage { display:block; width:min(100%,360px); max-height:66svh; object-fit:contain; margin:0 auto 18px; border-radius:18px; }
    .result-wrap h2 { margin:0 0 8px; }
    .result-wrap p { margin:0 0 17px; color:#e4e4e4; line-height:1.6; }
    .result-buttons { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; }
    .result-buttons .primary { width:auto; min-height:48px; }
    .result-buttons .secondary { color:#173a76; }
    @media (max-height:720px) { .card { padding:21px 23px; }.mission { margin:13px 0; padding:12px; }.intro { margin-bottom:12px; } }
  </style>
</head>
<body>
  <main id="missionScreen" class="screen">
    <section class="card" aria-labelledby="mainTitle">
      <span class="eyebrow">STELLAR PET MARCHE</span>
      <h1 id="mainTitle">第2回<br>隠しミッション🌟</h1>
      <p class="intro">ステラペットマルシェ開催を<br><strong>みんなでアピールしよう！</strong></p>
      <div class="mission">
        <p class="mission-title">ARフィルターで写真を撮って<br>Instagramに投稿しよう📷️</p>
        <p class="tags">#ステラペットマルシェ<br>#ステラモール<br>#ペピカ<br>@stellar_petmarche をつけてね❣️</p>
      </div>
      <button id="startButton" class="primary" type="button">カメラで撮影する ✨</button>
      <div style="margin-top:11px">
        <button id="choosePhotoButton" class="secondary" type="button">端末の写真を選んでフレームをつける 🖼️</button>
      </div>
      <input id="photoPicker" class="hidden" type="file" accept="image/*" aria-label="フレームをつける写真を選択">
      <p class="note">カメラを使わず、端末に保存した写真からも作れます。<br>写真を選ぶときはカメラ許可は不要です。</p>
      <p id="errorMessage" class="error hidden" role="alert"></p>
    </section>
  </main>

  <section id="cameraScreen" class="hidden" aria-label="AR撮影画面">
    <div class="camera">
      <video id="video" autoplay playsinline muted></video>
      <img id="frame" src="./stellar-ar-frame.png?v=3" alt="" aria-hidden="true">
      <div class="cam-top">
        <span class="cam-label">第2回 隠しミッション</span>
        <button id="closeCamera" class="icon-button" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="cam-bottom">
        <button id="flipCamera" class="flip" type="button" aria-label="カメラを切り替え">↻</button>
        <button id="takePhoto" class="shutter" type="button" aria-label="写真を撮影"></button>
        <span style="width:52px" aria-hidden="true"></span>
      </div>
    </div>
  </section>

  <section id="captureScreen" class="screen hidden" aria-label="加工した写真">
    <div class="result-wrap">
      <img id="resultImage" alt="ARフィルターで撮影した写真">
      <h2>できました📷️</h2>
      <p>写真を保存して、Instagramに投稿しよう！<br>ハッシュタグと @stellar_petmarche をつけてね❣️</p>
      <div class="result-buttons">
        <button id="savePhoto" class="primary" type="button">写真を保存する</button>
        <button id="retakePhoto" class="secondary" type="button">もう一度撮る</button>
        <button id="chooseAnotherPhoto" class="secondary" type="button">別の写真を選ぶ</button>
        <button id="backToMission" class="secondary" type="button">案内に戻る</button>
      </div>
    </div>
  </section>

  <canvas id="captureCanvas" class="hidden"></canvas>
  <script>
    const missionScreen = document.querySelector('#missionScreen');
    const cameraScreen = document.querySelector('#cameraScreen');
    const captureScreen = document.querySelector('#captureScreen');
    const video = document.querySelector('#video');
    const frame = document.querySelector('#frame');
    const canvas = document.querySelector('#captureCanvas');
    const errorMessage = document.querySelector('#errorMessage');
    const photoPicker = document.querySelector('#photoPicker');
    let stream = null;
    let facingMode = 'environment';
    let photoUrl = null;

    function hideError() { errorMessage.classList.add('hidden'); errorMessage.textContent = ''; }
    function showError(message) { errorMessage.textContent = message; errorMessage.classList.remove('hidden'); }
    function stopCamera() {
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
    }
    function showCamera() {
      missionScreen.classList.add('hidden');
      captureScreen.classList.add('hidden');
      cameraScreen.classList.remove('hidden');
    }
    function showResult(blob) {
      if (!blob) { showError('写真を加工できませんでした。別の写真を選んでください。'); return; }
      if (photoUrl) URL.revokeObjectURL(photoUrl);
      photoUrl = URL.createObjectURL(blob);
      document.querySelector('#resultImage').src = photoUrl;
      stopCamera();
      cameraScreen.classList.add('hidden');
      missionScreen.classList.add('hidden');
      captureScreen.classList.remove('hidden');
    }
    async function openCamera() {
      hideError();
      try {
        await waitForFrame();
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('unsupported');
        stopCamera();
        stream = await navigator.mediaDevices.getUserMedia({
          audio:false,
          video:{ facingMode:{ ideal:facingMode }, width:{ ideal:1920 }, height:{ ideal:1080 } }
        });
        video.srcObject = stream;
        await video.play();
        showCamera();
      } catch (error) {
        if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
          showError('カメラが許可されていません。ブラウザーの設定でカメラを許可してください。写真を選ぶ方法も使えます。');
        } else if (error.message === 'unsupported') {
          showError('このブラウザーではカメラを起動できません。端末の写真を選ぶ方法をお試しください。');
        } else if (error.message === 'frame-load-failed') {
          showError('フレーム画像を読み込めません。index.html を最新版に置き換えてください。');
        } else {
          showError('カメラを起動できませんでした。HTTPSで開いているか、カメラが他のアプリで使用中でないか確認してください。');
        }
      }
    }
    function drawCover(ctx, source, width, height) {
      const sourceWidth = source.videoWidth || source.naturalWidth || source.width;
      const sourceHeight = source.videoHeight || source.naturalHeight || source.height;
      const scale = Math.max(width / sourceWidth, height / sourceHeight);
      const cropWidth = width / scale;
      const cropHeight = height / scale;
      const sx = (sourceWidth - cropWidth) / 2;
      const sy = (sourceHeight - cropHeight) / 2;
      ctx.drawImage(source, sx, sy, cropWidth, cropHeight, 0, 0, width, height);
    }
    function waitForFrame() {
      if (frame.complete) {
        return frame.naturalWidth > 0 ? Promise.resolve() : Promise.reject(new Error('frame-load-failed'));
      }
      return new Promise((resolve, reject) => {
        const loaded = () => { cleanup(); resolve(); };
        const failed = () => { cleanup(); reject(new Error('frame-load-failed')); };
        const cleanup = () => { frame.removeEventListener('load', loaded); frame.removeEventListener('error', failed); };
        frame.addEventListener('load', loaded, { once:true });
        frame.addEventListener('error', failed, { once:true });
      });
    }
    if (frame.complete && frame.naturalWidth > 0) frame.style.visibility = 'visible';
    else frame.addEventListener('load', () => { frame.style.visibility = 'visible'; }, { once:true });
    frame.addEventListener('error', () => {
      frame.style.visibility = 'hidden';
      showError('フレーム画像を読み込めません。index.html を最新版に置き換えてください。');
    });
    async function compositePhoto(photo) {
      try {
        await waitForFrame();
        const width = 1080, height = 1920;
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        drawCover(ctx, photo, width, height);
        ctx.drawImage(frame, 0, 0, width, height);
        canvas.toBlob(showResult, 'image/jpeg', .94);
      } catch (error) {
        showError('フレーム画像を読み込めません。index.html を最新版に置き換えてください。');
      }
    }
    document.querySelector('#startButton').addEventListener('click', openCamera);
    document.querySelector('#choosePhotoButton').addEventListener('click', () => photoPicker.click());
    document.querySelector('#chooseAnotherPhoto').addEventListener('click', () => photoPicker.click());
    photoPicker.addEventListener('change', async () => {
      const file = photoPicker.files && photoPicker.files[0];
      if (!file) return;
      hideError();
      try {
        let photo;
        if ('createImageBitmap' in window) {
          photo = await createImageBitmap(file, { imageOrientation:'from-image' });
          await compositePhoto(photo);
          photo.close();
        } else {
          photo = new Image();
          const temporaryUrl = URL.createObjectURL(file);
          photo.onload = async () => { await compositePhoto(photo); URL.revokeObjectURL(temporaryUrl); };
          photo.onerror = () => { URL.revokeObjectURL(temporaryUrl); showError('写真を開けませんでした。別の画像を選んでください。'); };
          photo.src = temporaryUrl;
        }
      } catch (error) {
        showError('写真を開けませんでした。別の画像を選んでください。');
      } finally {
        photoPicker.value = '';
      }
    });
    document.querySelector('#closeCamera').addEventListener('click', () => {
      stopCamera(); cameraScreen.classList.add('hidden'); missionScreen.classList.remove('hidden');
    });
    document.querySelector('#flipCamera').addEventListener('click', async () => {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      await openCamera();
    });
    document.querySelector('#takePhoto').addEventListener('click', async () => {
      if (!video.videoWidth) return;
      hideError();
      const width = 1080, height = 1920;
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      drawCover(ctx, video, width, height);
      try {
        await waitForFrame();
        ctx.drawImage(frame, 0, 0, width, height);
        canvas.toBlob(showResult, 'image/jpeg', .94);
      } catch (error) {
        showError('フレーム画像を読み込めません。index.html を最新版に置き換えてください。');
      }
    });
    document.querySelector('#savePhoto').addEventListener('click', () => {
      if (!photoUrl) return;
      const link = document.createElement('a');
      link.href = photoUrl;
      link.download = 'stellar-pet-marche-mission2.jpg';
      link.click();
    });
    document.querySelector('#retakePhoto').addEventListener('click', openCamera);
    document.querySelector('#backToMission').addEventListener('click', () => {
      captureScreen.classList.add('hidden'); missionScreen.classList.remove('hidden');
    });
    window.addEventListener('pagehide', stopCamera);
  </script>
</body>
</html>
