<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#24102f">
  <title>ステラペットマルシェ｜ハロウィンARカメラ</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family:
        -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
        "Yu Gothic", Meiryo, sans-serif;
    }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #camera {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    #frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      z-index: 2;
    }


    /* 左下の木のパネルの「あと［数字］日！」の数字部分 */
    #countdownOverlay {
      position: absolute;
      left: 16.5%;
      top: 64.2%;
      width: 10.5%;
      height: 5.8%;
      z-index: 3;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffd447;
      text-align: center;
      font-weight: 900;
      font-size: clamp(27px, 7vw, 50px);
      line-height: 1;
      letter-spacing: -0.03em;
      text-shadow:
        0 2px 0 #4a2400,
        0 0 5px rgba(255, 166, 0, 0.45);
      transform: rotate(-1.5deg);
    }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    #controls[hidden] {
      display: none;
    }

    .round-button {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: rgba(20, 20, 20, 0.72);
      font-size: 25px;
    }

    #shutterButton {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #fff;
      border: 6px solid rgba(255, 255, 255, 0.55);
      box-shadow:
        0 0 0 4px rgba(0, 0, 0, 0.6),
        0 5px 18px rgba(0, 0, 0, 0.35);
    }

    button:active {
      transform: scale(0.97);
    }

    .screen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(24px, env(safe-area-inset-top))
        22px
        max(24px, env(safe-area-inset-bottom));
      color: #fff;
      text-align: center;
      background:
        radial-gradient(circle at 50% 15%, rgba(255, 146, 22, 0.26), transparent 38%),
        linear-gradient(160deg, #4b2357, #160a20 75%);
    }

    .panel {
      width: min(100%, 410px);
      padding: 30px 22px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
    }

    .panel h1 {
      margin: 0 0 14px;
      font-size: clamp(27px, 7vw, 36px);
      line-height: 1.35;
    }

    .panel p {
      margin: 0 0 24px;
      font-size: 16px;
      line-height: 1.75;
    }

    .main-button,
    .sub-button {
      width: 100%;
      min-height: 54px;
      padding: 14px 20px;
      border-radius: 999px;
      font-weight: 800;
    }

    .main-button {
      color: #fff;
      background: #ff8a00;
      font-size: 17px;
    }

    .sub-button {
      margin-top: 12px;
      color: #2d173a;
      background: #fff;
      font-size: 15px;
    }

    #permissionGuide {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.28);
      text-align: left;
      font-size: 14px;
      line-height: 1.7;
    }

    #permissionGuide strong {
      color: #ffd37e;
    }

    #previewScreen {
      z-index: 20;
      display: none;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.94);
    }

    #previewImage {
      max-width: 100%;
      max-height: calc(100% - 100px);
      object-fit: contain;
      border-radius: 14px;
    }

    #previewActions {
      width: min(100%, 430px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    #saveButton,
    #retakeButton {
      padding: 13px 20px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 800;
    }

    #saveButton {
      color: #fff;
      background: #ff8a00;
    }


    #retakeButton {
      color: #222;
      background: #fff;
    }

    #saveHint {
      margin: 11px 0 0;
      color: #fff;
      font-size: 13px;
      line-height: 1.5;
    }

    #messageBar {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      z-index: 5;
      max-width: 90%;
      padding: 8px 13px;
      border-radius: 999px;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0, 0, 0, 0.58);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    #messageBar.show {
      opacity: 1;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>
  <main id="app">
    <video id="camera" autoplay muted playsinline></video>

    <!-- index.htmlと同じ場所に、透過PNGの frame.png を置いてください -->
    <img id="frame" src="frame.png" alt="ステラペットマルシェ限定フレーム">

    <div id="countdownOverlay" aria-hidden="true"></div>
    <div id="messageBar"></div>

    <div id="controls" hidden>
      <button id="switchCameraButton" class="round-button" type="button" aria-label="カメラ切替">↻</button>
      <button id="shutterButton" type="button" aria-label="撮影"></button>
      <button id="helpButton" class="round-button" type="button" aria-label="使い方">?</button>
    </div>

    <section id="startScreen" class="screen">
      <div class="panel">
        <h1>🎃 ハロウィン限定<br>ARカメラ</h1>

        <p>
          「カメラを使用する」を押すと、<br>
          スマートフォンの確認画面が開きます。<br>
          そこで<strong>「許可」</strong>を選んでください。
        </p>

        <button id="startButton" class="main-button" type="button">
          カメラを使用する
        </button>

        <button id="retryButton" class="sub-button" type="button" hidden>
          設定変更後にもう一度試す
        </button>

        <div id="permissionGuide"></div>
      </div>
    </section>

    <section id="previewScreen" class="screen">
      <img id="previewImage" alt="撮影した写真">

      <div id="previewActions">
        <button id="saveButton" type="button">写真に保存</button>
        <button id="retakeButton" type="button">撮り直す</button>
      </div>

      <p id="saveHint">
        iPhoneでは保存ボタン後に表示される画面から「画像を保存」を選んでください。
      </p>
    </section>

    <canvas id="photoCanvas"></canvas>
  </main>

  <script>
    "use strict";

    const EVENT_YEAR = 2026;
    const EVENT_MONTH = 10;
    const EVENT_DAY = 17;

    const video = document.getElementById("camera");
    const frame = document.getElementById("frame");
    const countdownOverlay = document.getElementById("countdownOverlay");
    const controls = document.getElementById("controls");
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const retryButton = document.getElementById("retryButton");
    const permissionGuide = document.getElementById("permissionGuide");
    const switchCameraButton = document.getElementById("switchCameraButton");
    const shutterButton = document.getElementById("shutterButton");
    const helpButton = document.getElementById("helpButton");
    const previewScreen = document.getElementById("previewScreen");
    const previewImage = document.getElementById("previewImage");
    const saveButton = document.getElementById("saveButton");
    const retakeButton = document.getElementById("retakeButton");
    const canvas = document.getElementById("photoCanvas");
    const messageBar = document.getElementById("messageBar");

    let stream = null;
    let facingMode = "environment";
    let capturedPhoto = "";
    let capturedBlob = null;
    let isStarting = false;


    function getJapanTodayParts() {
      const formatter = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Tokyo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      });

      const parts = formatter.formatToParts(new Date());
      const values = {};

      for (const part of parts) {
        if (part.type !== "literal") {
          values[part.type] = Number(part.value);
        }
      }

      return {
        year: values.year,
        month: values.month,
        day: values.day
      };
    }

    function getCountdownInfo() {
      const today = getJapanTodayParts();
      const todayUtc = Date.UTC(today.year, today.month - 1, today.day);
      const eventUtc = Date.UTC(EVENT_YEAR, EVENT_MONTH - 1, EVENT_DAY);
      const days = Math.ceil((eventUtc - todayUtc) / 86400000);

      if (days > 0) {
        return { type: "days", days };
      }

      if (days === 0) {
        return { type: "today", days: 0 };
      }

      return { type: "finished", days };
    }

    function updateCountdown() {
      const info = getCountdownInfo();

      if (info.type === "days") {
        countdownOverlay.textContent = info.days;
      } else if (info.type === "today") {
        countdownOverlay.textContent = "0";
      } else {
        countdownOverlay.textContent = "";
      }
    }

    function showMessage(text, duration = 2200) {
      messageBar.textContent = text;
      messageBar.classList.add("show");

      clearTimeout(showMessage.timer);
      showMessage.timer = setTimeout(() => {
        messageBar.classList.remove("show");
      }, duration);
    }

    function stopCamera() {
      if (!stream) return;

      stream.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
    }

    function setLoading(loading) {
      isStarting = loading;
      startButton.disabled = loading;
      retryButton.disabled = loading;

      startButton.textContent = loading
        ? "カメラを起動しています…"
        : "カメラを使用する";

      retryButton.textContent = loading
        ? "確認しています…"
        : "設定変更後にもう一度試す";
    }

    function showPermissionDeniedGuide() {
      permissionGuide.style.display = "block";
      permissionGuide.innerHTML = `
        <strong>カメラがブロックされています</strong><br>
        一度「許可しない」を選んだ場合は、ブラウザの設定を変更してください。<br><br>

        <strong>iPhone・Safari</strong><br>
        アドレス欄の「ぁあ」→「Webサイトの設定」→
        「カメラ」→「許可」<br><br>

        <strong>Android・Chrome</strong><br>
        アドレス欄左の設定アイコン→「権限」→
        「カメラ」→「許可」<br><br>

        変更後、「設定変更後にもう一度試す」を押してください。
      `;

      startButton.hidden = true;
      retryButton.hidden = false;
    }

    function showGeneralError(message) {
      permissionGuide.style.display = "block";
      permissionGuide.textContent = message;
      startButton.hidden = false;
      retryButton.hidden = false;
    }

    function updateMirror() {
      video.style.transform =
        facingMode === "user" ? "scaleX(-1)" : "none";
    }

    async function openCamera() {
      if (isStarting) return;

      setLoading(true);
      permissionGuide.style.display = "none";

      try {
        if (!window.isSecureContext) {
          throw new Error("HTTPS_REQUIRED");
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("UNSUPPORTED_BROWSER");
        }

        stopCamera();

        /*
          まだ許可状態が未選択なら、ここでスマートフォン標準の
          カメラ許可画面が表示されます。
        */
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });

        video.srcObject = stream;
        await video.play();

        updateMirror();
        startScreen.style.display = "none";
        controls.hidden = false;
        showMessage("中央の白いボタンで撮影できます");
      } catch (error) {
        console.error("Camera error:", error);

        if (
          error.name === "NotAllowedError" ||
          error.name === "PermissionDeniedError"
        ) {
          showPermissionDeniedGuide();
        } else if (error.message === "HTTPS_REQUIRED") {
          showGeneralError(
            "GitHub Pagesの公開URLから開いてください。カメラはHTTPSページでのみ利用できます。"
          );
        } else if (error.message === "UNSUPPORTED_BROWSER") {
          showGeneralError(
            "SafariまたはChromeで開いてください。このブラウザはカメラに対応していません。"
          );
        } else if (error.name === "NotFoundError") {
          showGeneralError("利用できるカメラが見つかりませんでした。");
        } else if (error.name === "NotReadableError") {
          showGeneralError(
            "ほかのカメラアプリを閉じてから、もう一度お試しください。"
          );
        } else {
          showGeneralError(
            "カメラを起動できませんでした。ページを再読み込みして、もう一度お試しください。"
          );
        }
      } finally {
        setLoading(false);
      }
    }

    async function switchCamera() {
      facingMode =
        facingMode === "environment" ? "user" : "environment";

      await openCamera();
    }

    function getCoverCrop(
      sourceWidth,
      sourceHeight,
      targetWidth,
      targetHeight
    ) {
      const sourceRatio = sourceWidth / sourceHeight;
      const targetRatio = targetWidth / targetHeight;

      let sx = 0;
      let sy = 0;
      let sw = sourceWidth;
      let sh = sourceHeight;

      if (sourceRatio > targetRatio) {
        sw = sourceHeight * targetRatio;
        sx = (sourceWidth - sw) / 2;
      } else {
        sh = sourceWidth / targetRatio;
        sy = (sourceHeight - sh) / 2;
      }

      return { sx, sy, sw, sh };
    }


    function drawCountdownOnCanvas(context, outputWidth, outputHeight) {
      const info = getCountdownInfo();

      if (info.type === "finished") return;

      // frame.png 左下の木製看板の空白位置
      const centerX = outputWidth * 0.215;
      const centerY = outputHeight * 0.665;

      context.save();
      context.translate(centerX, centerY);
      context.rotate(-1.5 * Math.PI / 180);
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.shadowColor = "rgba(55, 25, 0, 0.65)";
      context.shadowBlur = 5;
      context.shadowOffsetY = 2;
      context.font =
        '900 66px -apple-system, BlinkMacSystemFont, "Yu Gothic", Meiryo, sans-serif';
      context.fillStyle = "#ffd447";
      context.fillText(String(Math.max(info.days, 0)), 0, 0);
      context.restore();
    }

    function canvasToBlob(canvasElement, type = "image/jpeg", quality = 0.94) {
      return new Promise((resolve, reject) => {
        canvasElement.toBlob(blob => {
          if (blob) {
            resolve(blob);
          } else {
            reject(new Error("画像の作成に失敗しました。"));
          }
        }, type, quality);
      });
    }

    async function takePhoto() {
      if (!video.videoWidth || !video.videoHeight) {
        showMessage("カメラの準備ができていません");
        return;
      }

      if (!frame.complete || frame.naturalWidth === 0) {
        showMessage("frame.pngを読み込めませんでした");
        return;
      }

      const outputWidth = 1080;
      const outputHeight = 1920;
      const context = canvas.getContext("2d");

      canvas.width = outputWidth;
      canvas.height = outputHeight;
      context.clearRect(0, 0, outputWidth, outputHeight);

      const crop = getCoverCrop(
        video.videoWidth,
        video.videoHeight,
        outputWidth,
        outputHeight
      );

      context.save();

      if (facingMode === "user") {
        context.translate(outputWidth, 0);
        context.scale(-1, 1);
      }

      context.drawImage(
        video,
        crop.sx,
        crop.sy,
        crop.sw,
        crop.sh,
        0,
        0,
        outputWidth,
        outputHeight
      );

      context.restore();
      context.drawImage(frame, 0, 0, outputWidth, outputHeight);
      drawCountdownOnCanvas(context, outputWidth, outputHeight);

      try {
        capturedBlob = await canvasToBlob(canvas);
        capturedPhoto = URL.createObjectURL(capturedBlob);
        previewImage.src = capturedPhoto;
        previewScreen.style.display = "flex";
      } catch (error) {
        console.error(error);
        showMessage("撮影画像の作成に失敗しました");
      }
    }


    function getFileName() {
      const timestamp = new Date()
        .toISOString()
        .replace(/[:.]/g, "-")
        .slice(0, 19);

      return `stellar-pet-marche-halloween-${timestamp}.jpg`;
    }

    function getFileForSaving() {
      return new File(
        [capturedBlob],
        getFileName(),
        { type: "image/jpeg" }
      );
    }

    function downloadPhoto() {
      if (!capturedBlob || !capturedPhoto) return;

      const link = document.createElement("a");
      link.href = capturedPhoto;
      link.download = getFileName();
      document.body.appendChild(link);
      link.click();
      link.remove();
      showMessage("写真を保存しました");
    }

    async function savePhoto() {
      if (!capturedBlob) return;

      const file = getFileForSaving();

      /*
        iPhone/Safariなど、画像ファイルの共有に対応している端末では
        OS標準の保存・共有画面を開きます。
        ブラウザの安全仕様上、Webページから無確認で「写真」アプリへ
        直接書き込むことはできません。
      */
      if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({ files: [file] })
      ) {
        try {
          await navigator.share({
            files: [file],
            title: "ステラペットマルシェ"
          });
          return;
        } catch (error) {
          if (error.name === "AbortError") return;
          console.error(error);
        }
      }

      downloadPhoto();
    }


    function retakePhoto() {
      previewScreen.style.display = "none";
      previewImage.removeAttribute("src");

      if (capturedPhoto) {
        URL.revokeObjectURL(capturedPhoto);
      }

      capturedPhoto = "";
      capturedBlob = null;
    }

    function showHelp() {
      alert(
        "使い方\n\n" +
        "1. 「カメラを使用する」を押します。\n" +
        "2. スマートフォンの確認画面で「許可」を押します。\n" +
        "3. ワンちゃんを中央に合わせます。\n" +
        "4. 白い丸ボタンで撮影します。\n" +
        "5. 「写真に保存」を押します。"
      );
    }

    startButton.addEventListener("click", openCamera);
    retryButton.addEventListener("click", openCamera);
    switchCameraButton.addEventListener("click", switchCamera);
    shutterButton.addEventListener("click", takePhoto);
    saveButton.addEventListener("click", savePhoto);
    retakeButton.addEventListener("click", retakePhoto);
    helpButton.addEventListener("click", showHelp);
    window.addEventListener("pagehide", stopCamera);

    updateCountdown();
  </script>
</body>
</html>
